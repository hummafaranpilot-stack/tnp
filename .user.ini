; Hostinger honors .user.ini in the docroot for per-site PHP overrides.
; Offer product images can run 3-6 MB before compression, so raise the
; default post/upload limits. Also bump the script timeout in case a
; large upload takes a moment over slow mobile connections.
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60
max_input_time = 60
memory_limit = 128M
